[package]
name = "sndbx"
version = "0.39.1"
edition = "2024"
description = "A small wrapper around docker run for running coding agents in a sandbox"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
